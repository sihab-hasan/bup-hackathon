name: Docker image

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: gridwise-api:test

      - name: Verify container health
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name gridwise-api --publish 8000:8000 \
            --env API_KEY=test-only-placeholder gridwise-api:test
          trap 'docker logs gridwise-api' EXIT

          for attempt in {1..20}; do
            if response=$(curl --fail --silent http://127.0.0.1:8000/health); then
              test "$response" = '{"status":"ok"}'
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push'
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag gridwise-api:test "$image:sha-${GITHUB_SHA}"
          docker push "$image:sha-${GITHUB_SHA}"

          if [ "$GITHUB_REF_NAME" = "main" ]; then
            docker tag gridwise-api:test "$image:latest"
            docker push "$image:latest"
          fi
