services:
  - type: web
    name: gridwise-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "20"
      - key: OPTIMIZER_TIMEOUT_SECONDS
        value: "20"
      - key: GEMINI_API_KEY
        sync: false
